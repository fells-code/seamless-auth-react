name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fells-code/seamless-auth-js'
    name: Version or Publish Package
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release PR branch, tags, and GitHub Releases.
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC), which also signs provenance.
      id-token: write
    env:
      HUSKY: 0

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/

      # The job holds an OIDC token and publish credentials, so no dependency
      # runs an install script here. No package needs one to build or test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run check-npm-build

      - name: Version or publish package
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version-packages
          publish: npm run release:stable
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
